name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/todo_db

    steps:
      # ----------------------------
      # 1. Checkout code
      # ----------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # ----------------------------
      # 2. Setup Python
      # ----------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Google Chrome
        run: |
          sudo apt update
          sudo apt install -y wget unzip
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: Install ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          wget -O chromedriver.zip https://chromedriver.storage.googleapis.com/${CHROME_VERSION}/chromedriver_linux64.zip
          unzip chromedriver.zip
          sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g pa11y  # pour tests accessibilité

      # ----------------------------
      # 3. Linter (flake8)
      # ----------------------------
      - name: Lint code
        run: |
          pip install flake8
          flake8 . --exit-zero --format=json --output-file=lint-report.json

      # ----------------------------
      # 4. Run Django tests (unit tests)
      # ----------------------------
      - name: Run test
        run: bash ./scripts/test_matrix.sh
      # ----------------------------
      # 5. Run Selenium end-to-end tests
      # ----------------------------
      - name: Selenium tests
        run: |
          python -m pip install selenium
          python scripts/sele.py

      # ----------------------------
      # 6. Run accessibility tests (pa11y)
      # ----------------------------
      - name: Accessibility tests
        run: |
          bash scripts/test_accessibility.sh
          # Convertir les rapports HTML en JSON si nécessaire
          python scripts/convert_pa11y_html_to_json.py accessibility-reports/ accessibility-report.json

      # ----------------------------
      # 7. Collect and summarize reports
      # ----------------------------
      - name: Test report summary
        run: |
          python scripts/generate_global_report.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


